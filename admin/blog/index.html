---
layout: base
title: Blog Editor
permalink: /admin/blog/
---

<link rel="stylesheet" href="https://get.mavo.io/mavo.css">
<script src="https://get.mavo.io/mavo.js"></script>
<link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}?v=3">

<main class="blog-admin">
  <section class="limit">
    <article>
      <header>
        <h1>Blog editor</h1>
      </header>

      <p class="blog-admin-intro">
        Sign in with GitHub to add, edit, publish, or remove blog posts. Saving updates the blog data in this repository.
      </p>

      <section
        class="blog-editor"
        mv-app="blog"
        mv-storage="https://github.com/MegaMind98/website-ipt/blob/master/_data/blog.json"
        mv-github-commit-prefix="Blog: "
      >
        <article class="blog-editor-post" property="post" mv-multiple>
          <div class="blog-editor-post-heading">
            <h2>Post details</h2>
            <label class="blog-published">
              <input type="checkbox" property="published" checked>
              <span>Published</span>
            </label>
          </div>

          <div class="blog-field blog-field-full">
            <label>Title</label>
            <input property="title" required placeholder="Enter the post title">
          </div>

          <div class="blog-form-grid">
            <div class="blog-field">
              <label>Slug</label>
              <input property="slug" placeholder="example-post-title">
              <small>Used in the post link.</small>
            </div>

            <div class="blog-field">
              <label>Date</label>
              <input type="date" property="date">
            </div>

            <div class="blog-field">
              <label>Author</label>
              <input property="author" value="Indra P. Tiwari">
            </div>

            <div class="blog-field">
              <label>Category</label>
              <input property="category" placeholder="Development">
            </div>
          </div>

          <div class="blog-field blog-field-full">
            <label>Featured image</label>
            <input property="image" placeholder="/assets/img/example.jpg">
            <small>Enter a site-relative image path or an HTTPS image URL.</small>
          </div>

          <div class="blog-field blog-field-full">
            <label>Excerpt</label>
            <textarea property="excerpt" rows="4" placeholder="Write a short summary for the blog listing."></textarea>
          </div>

          <div class="blog-field blog-field-full">
            <label>Content</label>
            <div class="blog-content-editor" property="content" mv-edit-type="richtext" aria-label="Post content"></div>
          </div>
        </article>
      </section>
    </article>
  </section>
</main>
